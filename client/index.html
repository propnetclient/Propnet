<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Professional real estate network for brokers and agents" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="PropNet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PropNet" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/icons/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-propnet.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/icon-propnet.svg" />
    
    <!-- Windows specific -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    
    <title>PropNet - Real Estate Network</title>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen for PWA startup -->
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #2563eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      ">
        <svg width="64" height="64" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M96 40L40 76V152H152V76L96 40Z" fill="white"/>
          <rect x="84" y="124" width="24" height="28" fill="#2563eb"/>
          <circle cx="100" cy="138" r="2" fill="white"/>
          <rect x="60" y="100" width="16" height="16" rx="2" fill="#2563eb"/>
          <rect x="116" y="100" width="16" height="16" rx="2" fill="#2563eb"/>
        </svg>
        <h1 style="margin: 16px 0 8px 0; font-size: 24px; font-weight: 600;">PropNet</h1>
        <p style="margin: 0; opacity: 0.8;">Loading...</p>
        <div style="
          width: 32px;
          height: 32px;
          border: 3px solid rgba(255,255,255,0.3);
          border-radius: 50%;
          border-top-color: white;
          animation: spin 1s ease-in-out infinite;
          margin-top: 16px;
        "></div>
      </div>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
