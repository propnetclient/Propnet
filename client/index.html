<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, minimal-ui" />
    <meta name="description" content="Professional real estate network for brokers and agents" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="PropNet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PropNet" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/icons/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-propnet-new.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/icon-propnet-new.svg" />
    
    <!-- Windows specific -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    
    <title>PropNet - Real Estate Network</title>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen for PWA startup -->
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #2563eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      ">
        <svg width="64" height="64" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M96 40L40 76V152H152V76L96 40Z" fill="white"/>
          <rect x="84" y="124" width="24" height="28" fill="#2563eb"/>
          <circle cx="100" cy="138" r="2" fill="white"/>
          <rect x="60" y="100" width="16" height="16" rx="2" fill="#2563eb"/>
          <rect x="116" y="100" width="16" height="16" rx="2" fill="#2563eb"/>
        </svg>
        <h1 style="margin: 16px 0 8px 0; font-size: 24px; font-weight: 600;">PropNet</h1>
        <p style="margin: 0; opacity: 0.8;">Loading...</p>
        <div style="
          width: 32px;
          height: 32px;
          border: 3px solid rgba(255,255,255,0.3);
          border-radius: 50%;
          border-top-color: white;
          animation: spin 1s ease-in-out infinite;
          margin-top: 16px;
        "></div>
      </div>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Ensure consistent rendering across devices */
      body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
    </style>
    
    <!-- Device compatibility script -->
    <script>
      // Immediate device detection and redirection for problematic devices
      (function() {
        var userAgent = navigator.userAgent;
        var isIOS = /iPad|iPhone|iPod/.test(userAgent);
        var isSamsung = /SamsungBrowser/.test(userAgent) || /SM-/.test(userAgent);
        var isProblematicDevice = isIOS || isSamsung;
        
        // Check if we're already on the no-sw version
        var isNoSW = window.location.pathname === '/no-sw.html' || window.location.search.includes('no-sw=1');
        
        if (isProblematicDevice && !isNoSW) {
          console.warn('Problematic device detected (' + (isIOS ? 'iOS' : 'Samsung') + '), redirecting to compatibility mode');
          // Immediate redirect to no-service-worker version
          window.location.href = '/no-sw.html' + window.location.search;
          return;
        }
        
        if (isNoSW && !isProblematicDevice) {
          console.log('Non-problematic device on no-sw version, redirecting to main app');
          window.location.href = '/';
          return;
        }
      })();
      
      // Global error handler for uncaught errors
      window.addEventListener('error', function(event) {
        console.error('Global error:', event.error);
        if (event.error && event.error.message) {
          // Show user-friendly error message
          const root = document.getElementById('root');
          if (root && !root.querySelector('.app-container')) {
            root.innerHTML = 
              '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#2563eb;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;padding:20px;box-sizing:border-box;text-align:center">' +
              '<h1 style="margin:16px 0 8px 0;font-size:24px;font-weight:600">PropNet</h1>' +
              '<p style="margin:0 0 16px 0;opacity:0.8">Loading failed, restarting...</p>' +
              '<button onclick="window.location.reload()" style="background:white;color:#2563eb;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:16px">Retry</button>' +
              '</div>';
            setTimeout(function() { window.location.reload(); }, 3000);
          }
        }
      });

      // Handle unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('Unhandled promise rejection:', event.reason);
        event.preventDefault(); // Prevent the default browser behavior
      });

      // Device-specific fixes
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var isAndroid = /Android/.test(navigator.userAgent);
      var isSamsung = /SamsungBrowser/.test(navigator.userAgent) || /SM-/.test(navigator.userAgent);
      var isOldDevice = /Android [1-6]/.test(navigator.userAgent) || /iPhone OS [1-9]_/.test(navigator.userAgent);
      var isProblematicDevice = isIOS || isSamsung;

      // Force app initialization on problematic devices
      window.addEventListener('DOMContentLoaded', function() {
        // Immediate check for old devices
        if (isOldDevice) {
          console.warn('Old device detected, applying compatibility fixes');
          document.body.style.overflow = 'hidden';
          document.documentElement.style.overflow = 'hidden';
        }

        // Aggressive monitoring for problematic devices
        if (isProblematicDevice) {
          console.warn('iOS/Samsung device detected - applying aggressive recovery monitoring');
          
          // Shorter timeout for problematic devices
          var aggressiveTimeout = setTimeout(function() {
            var loader = document.querySelector('#root > div[style*="background: rgb(37, 99, 235)"]');
            if (loader) {
              console.error('App failed to load on problematic device, forcing reload');
              window.location.reload();
            }
          }, 5000);
          
          // Multiple fallback checks
          var fallbackChecks = [3000, 4000, 6000, 8000];
          fallbackChecks.forEach(function(delay) {
            setTimeout(function() {
              var root = document.getElementById('root');
              if (root && !root.querySelector('.app-container')) {
                console.warn('App container not found at ' + delay + 'ms, checking DOM state');
                var hasOnlyLoader = root.children.length === 1 && 
                                   root.firstElementChild && 
                                   root.firstElementChild.style.background.includes('37, 99, 235');
                if (hasOnlyLoader) {
                  console.error('Still showing only loader at ' + delay + 'ms');
                  if (delay >= 6000) {
                    window.location.reload();
                  }
                }
              }
            }, delay);
          });
          
          // Clear aggressive timeout if app loads
          var observer = new MutationObserver(function(mutations) {
            var appContainer = document.querySelector('.app-container');
            if (appContainer) {
              clearTimeout(aggressiveTimeout);
              observer.disconnect();
              console.log('App loaded successfully on problematic device');
            }
          });
          observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        } else {
          // Standard monitoring for other devices
          var loadingTimeout = setTimeout(function() {
            var loader = document.querySelector('#root > div[style*="background: rgb(37, 99, 235)"]');
            if (loader) {
              console.warn('Loading timeout detected, forcing reload in 10 seconds');
              setTimeout(function() {
                if (document.querySelector('#root > div[style*="background: rgb(37, 99, 235)"]')) {
                  window.location.reload();
                }
              }, 10000);
            }
          }, 8000);
        }

        // Clear timeout when app loads successfully
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.addedNodes.length > 0) {
              var appContainer = document.querySelector('.app-container');
              if (appContainer) {
                clearTimeout(loadingTimeout);
                observer.disconnect();
              }
            }
          });
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
      });

      // Handle PWA visibility changes
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && window.location.pathname === '/') {
          setTimeout(function() {
            if (window.fetch) {
              fetch('/api/auth/me', { credentials: 'include' }).catch(function() {
                // Silent fail for offline scenarios
              });
            }
          }, 1000);
        }
      });

      // iOS-specific fixes
      if (isIOS) {
        // Fix iOS viewport issues
        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no');
        }

        // Prevent iOS bounce effect
        document.addEventListener('touchmove', function(event) {
          if (event.scale !== 1) {
            event.preventDefault();
          }
        }, { passive: false });
      }
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
