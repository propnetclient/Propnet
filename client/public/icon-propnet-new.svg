  <circle cx="264" cy="285" r="3" fill="#fbbf24"/>
  
  <!-- Windows -->
  <rect x="200" y="220" width="24" height="24" fill="#3b82f6" stroke="#2563eb" stroke-width="2" rx="2"/>
  <rect x="288" y="220" width="24" height="24" fill="#3b82f6" stroke="#2563eb" stroke-width="2" rx="2"/>
  
  <!-- Window frames -->
  <line x1="212" y1="220" x2="212" y2="244" stroke="#1e40af" stroke-width="1"/>
  <line x1="200" y1="232" x2="224" y2="232" stroke="#1e40af" stroke-width="1"/>
  <line x1="300" y1="220" x2="300" y2="244" stroke="#1e40af" stroke-width="1"/>
  <line x1="288" y1="232" x2="312" y2="232" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Network connection dots -->
  <circle cx="140" cy="160" r="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <circle cx="372" cy="160" r="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <circle cx="140" cy="350" r="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <circle cx="372" cy="350" r="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  
  <!-- Connection lines -->
  <line x1="148" y1="160" x2="180" y2="180" stroke="#10b981" stroke-width="3" opacity="0.7"/>
  <line x1="364" y1="160" x2="332" y2="180" stroke="#10b981" stroke-width="3" opacity="0.7"/>
  <line x1="148" y1="350" x2="180" y2="320" stroke="#10b981" stroke-width="3" opacity="0.7"/>
  <line x1="364" y1="350" x2="332" y2="320" stroke="#10b981" stroke-width="3" opacity="0.7"/>
  
